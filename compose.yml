services:
  cloudflare-ddns:
    image: ghcr.io/ivannorderhaug/cloudflare-ddns:latest
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
